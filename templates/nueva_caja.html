<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Caja - Sys Bodega</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<header class="header">
    <div class="logo">
        <h1>Sys Bodega</h1>
        <span>Inventario de Computación</span>
    </div>
    <button class="btn-scanner" id="btnScanner">Escanear QR</button>
</header>

<div class="layout">
    <aside class="sidebar">
        <nav>
            <a href="/" class="menu-item">Dashboard</a>
            <a href="/productos" class="menu-item">Productos</a>
            <a href="/cajas" class="menu-item active">Cajas</a>
            <a href="/estantes" class="menu-item">Estantes</a>
            <a href="/entradas" class="menu-item">Entradas</a>
            <a href="/salidas" class="menu-item">Salidas</a>
            <a href="/movimientos" class="menu-item">Movimientos</a>
            <a href="/categorias" class="menu-item">Categorías</a>
        </nav>
    </aside>

    <main class="main">
        <section class="page-header">
            <h2>Registrar Nueva Caja</h2>
            <p>Ingresa la información de la caja y asigna su estante correspondiente</p>
        </section>

        <section class="form-section">
            <form id="formCrearCaja" class="card-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nombre">Nombre de la Caja *</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ej: Caja A-01" required>
                    </div>

                    <div class="form-group">
                        <label for="codigo_qr">Código QR / Identificador</label>
                        <input type="text" id="codigo_qr" name="codigo_qr" placeholder="Ej: QR-CAJA-001">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="id_estante">Estante *</label>
                        <select id="id_estante" name="id_estante" class="form-control" required>
                            <option value="">Cargando estantes...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="estado">Estado</label>
                        <select id="estado" name="estado" class="form-control">
                            <option value="Disponible">Disponible</option>
                            <option value="Ocupada">Ocupada</option>
                            <option value="Mantenimiento">Mantenimiento</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" name="descripcion" placeholder="Detalles o especificaciones de la caja..." rows="4"></textarea>
                </div>

                <div class="form-actions">
                    <a href="/cajas" class="btn-secondary">Cancelar</a>
                    <button type="submit" class="btn-primary">Guardar Caja</button>
                </div>
            </form>
        </section>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/static/js/app.js"></script>
<script src="/static/js/nueva_caja.js"></script>
</body>
</html>
